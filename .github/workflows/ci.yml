name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and offline checks
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: powershell
        run: ./tools/Invoke-CI.ps1 -Version '0.1.0-alpha.2' -Package
      - name: Upload verified packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-alpha-${{ github.sha }}
          path: |
            out/release/0.1.0-alpha.2/SaitekNativeFfb-0.1.0-alpha.2-win-x64.zip
            out/release/0.1.0-alpha.2/SaitekNativeFfb-0.1.0-alpha.2-source.zip
            out/release/0.1.0-alpha.2/release-manifest.json
            out/release/0.1.0-alpha.2/SHA256SUMS.txt
            out/release/0.1.0-alpha.2/verification-summary.json
          if-no-files-found: error
          retention-days: 14
