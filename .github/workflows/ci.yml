name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and offline checks
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and package
        shell: powershell
        run: ./tools/Invoke-CI.ps1 -Version '0.1.0-alpha.2' -Package
      - name: Prepare source-only CI artifacts
        shell: powershell
        run: |
          $source='SaitekNativeFfb-0.1.0-alpha.2-source.zip'
          Copy-Item -LiteralPath "out/release/0.1.0-alpha.2/$source" -Destination "out/ci/$source"
          $lines=@($source,'verification-summary.json') | ForEach-Object { (Get-FileHash -LiteralPath "out/ci/$_" -Algorithm SHA256).Hash+'  '+$_ }
          [IO.File]::WriteAllText((Join-Path $pwd 'out/ci/SHA256SUMS-source.txt'),($lines -join "`n")+"`n",[Text.UTF8Encoding]::new($false))
      - name: Upload verified source and results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-and-results-${{ github.sha }}
          path: |
            out/ci/SaitekNativeFfb-0.1.0-alpha.2-source.zip
            out/ci/SHA256SUMS-source.txt
            out/ci/verification-summary.json
          if-no-files-found: error
          retention-days: 14
